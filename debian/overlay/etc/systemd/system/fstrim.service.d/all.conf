# fstrim.service ships with --listed-in /etc/fstab:/proc/self/mountinfo, which
# reads the first accessible file rather than the union of the two. /etc/fstab
# is always readable, and the root filesystem has no entry in it: the kernel is
# told which partition to mount by root=PARTUUID= in the boot arguments. The
# stock service therefore trims nothing at all here.
#
# --all works from the mount table instead, so it reaches the root partition
# whichever one this image booted from, and skips the ramfs root of a TFTP
# initramfs boot as unsupported.
[Service]
ExecStart=
ExecStart=/sbin/fstrim --all --verbose --quiet-unsupported
