# lighttpd for the dvr-extract image.  Serves the DVR's recording partitions,
# which /init has mounted read-only under /srv/rec, as static files with
# directory listings and byte-range support.  tools/dvr-browser/ on another
# machine reads them from here.
#
# This is a read-only file server and nothing more.  No CGI, no upload, no
# WebDAV (that module is not even built -- see the defconfig).  The served tree
# is a read-only mount, so even a lighttpd bug could not write to the disk.

server.document-root = "/srv/rec"
server.port          = 80

# mod_dirlisting is a loadable module; the static-file handler and range
# support are in lighttpd's core and need no module line.
server.modules       = ( "mod_dirlisting" )
dir-listing.activate = "enable"

# Always show a listing, never look for an index.html to serve instead -- the
# recording directories contain only .dat files and metadata.
index-file.names     = ()

# Keep the browser from trying to render a 512 MB container as anything.
mimetype.assign      = ( ".dat" => "application/octet-stream" )

# /init creates these under the RAM rootfs before starting lighttpd.
server.errorlog      = "/var/log/lighttpd/error.log"
server.pid-file      = "/var/run/lighttpd.pid"

# There is no unprivileged web user in this image and it exists only to be run
# by hand on a lab network, so lighttpd stays as whoever /init started it.  It
# binds port 80, which needs root anyway.
